{% if page.wikipedia_card %}
<div class="ref-card">
  <p class="ref-card__title">Background</p>
  {% if page.wikipedia_card.thumbnail_url %}
    <img class="ref-wiki__thumb"
         src="{{ page.wikipedia_card.thumbnail_url }}"
         alt="{{ page.wikipedia_card.title }}"
         loading="lazy">
  {% endif %}
  <p class="ref-wiki__summary">{{ page.wikipedia_card.summary_text }}</p>
  <a class="ref-wiki__link"
     href="{{ page.wikipedia_card.article_url }}"
     rel="noopener external" target="_blank">
    Read more on Wikipedia &rarr;
  </a>
  <p class="ref-wiki__attr">
    Excerpt from <a href="{{ page.wikipedia_card.article_url }}" rel="noopener external" target="_blank">Wikipedia</a>,
    available under <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener external" target="_blank">CC BY-SA 4.0</a>.
  </p>
</div>
{% endif %}
