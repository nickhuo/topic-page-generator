<section class="hero{% if not hero.image_url %} hero--no-image{% endif %}" aria-label="Page lede">
  {% if hero.image_url %}
    <img class="hero__img"
         src="{{ hero.image_url }}"
         alt="{{ hero.image_alt | default('') }}"
         loading="eager">
  {% endif %}
  <div class="hero__overlay"></div>
  <div class="hero__body">
    <div class="hero__inner">
      <div class="hero__meta">
        {% if hero.dateline %}
          <span class="hero__badge">{{ hero.dateline }}</span>
        {% endif %}
        <time class="hero__time" datetime="{{ page.meta.last_updated }}">
          Updated {{ page.meta.last_updated[:10] }}
        </time>
      </div>

      <h1 class="hero__title">{{ hero.title }}</h1>

      {% if hero.subtitle %}
        <p class="hero__subtitle">{{ hero.subtitle }}</p>
      {% endif %}
    </div>
  </div>
</section>
