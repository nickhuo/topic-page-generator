<aside class="infobox" aria-label="Key facts">
  <h2 class="infobox__title">Key facts</h2>
  {% if m.data.rows %}
    {% for row in m.data.rows %}
      <div class="infobox__row" data-cite="{{ row.source_id }}">
        <span class="infobox__label">{{ row.label }}</span>
        <span class="infobox__value">
          {% if row.value is iterable and row.value is not string %}
            {{ row.value | join(", ") }}
          {% else %}
            {{ row.value }}
          {% endif %}
          {{ cite(row.source_id) | safe }}
        </span>
      </div>
    {% endfor %}
  {% else %}
    <p class="empty">Facts unavailable.</p>
  {% endif %}
</aside>
