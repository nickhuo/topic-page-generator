{% set density = quote_density[m.kind] %}
<section class="module-quotes" aria-label="{{ 'Reactions' if m.kind == 'reactions' else 'Official statements' }}">
  <h2>{{ 'Reactions' if m.kind == 'reactions' else 'Official statements' }}</h2>
  {% if m.data.items %}
    {% for item in m.data.items %}
      <figure class="quote quote--{{ density }}" data-cite="{{ item.source_id }}">
        <blockquote class="quote__text">&ldquo;{{ item.quote }}&rdquo;</blockquote>
        <figcaption class="quote__attr">
          — {{ item.author }}{% if m.kind == 'reactions' %}, {{ item.author_role }}{% else %}, {{ item.role }}, {{ item.organization }}{% endif %}
          {{ cite(item.source_id) | safe }}
        </figcaption>
      </figure>
    {% endfor %}
  {% else %}
    <p class="empty">No quotes available.</p>
  {% endif %}
</section>
