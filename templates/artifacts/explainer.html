<section class="module-explainer explainer" aria-label="Background">
  <h2>Background</h2>
  {% if m.data.paragraphs %}
    {% for p in m.data.paragraphs %}
      <p>{{ p.text }}
        {% for c in p.citations %}{{ cite(c.source_id) | safe }}{% endfor %}
      </p>
    {% endfor %}
  {% else %}
    <p class="empty">No background available.</p>
  {% endif %}
</section>
