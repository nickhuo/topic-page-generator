<section class="module-changelog" aria-label="What's new">
  <h2>What's new in {{ m.data.version_label }}</h2>
  {% if m.data.entries %}
    <ul class="changelog">
      {% for entry in m.data.entries %}
        <li class="changelog__entry" data-cite="{{ entry.source_id }}">
          <span class="changelog__badge changelog__badge--{{ entry.importance }}">{{ entry.importance }}</span>
          <strong>{{ entry.label }}</strong>
          <p>{{ entry.description }} {{ cite(entry.source_id) | safe }}</p>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No changes documented yet.</p>
  {% endif %}
</section>
