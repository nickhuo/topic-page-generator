<div class="block block--map">
  <ul class="map__locations">
    {% for loc in block.locations %}
      <li class="map-loc">
        <span class="map-loc__name">{{ loc.name }}</span>
        {% if loc.note %}<span class="map-loc__note">— {{ loc.note }}</span>{% endif %}
        {% if loc.source_id and source_index[loc.source_id] %}
          <sup class="cite-num" data-cite="{{ loc.source_id }}"><a href="#src-{{ source_index[loc.source_id] }}">[{{ source_index[loc.source_id] }}]</a></sup>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</div>
