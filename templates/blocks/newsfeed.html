<div class="block block--newsfeed block--newsfeed--{{ block.variant | default('news') }}">
  <ul class="newsfeed-scroller" role="list">
    {% for card in block.cards[:5] %}
      {% if card.thumbnail_url %}
        <li class="news-card">
          <figure class="news-card__media">
            <img src="{{ card.thumbnail_url }}" alt="" loading="lazy">
          </figure>

          <div class="news-card__body">
            <p class="news-card__outlet">{{ card.publisher }}</p>
            <h3 class="news-card__title">
              <a href="{{ card.url }}" rel="noopener noreferrer">{{ card.title }}</a>
            </h3>
            {% if card.summary %}
              <p class="news-card__summary">{{ card.summary }}</p>
            {% endif %}
            <p class="news-card__meta">
              {% if card.published_at %}
                <time class="news-card__date">{{ card.published_at[:10] }}</time>
              {% endif %}
            </p>
          </div>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
</div>
