[project]
name = "topic-page-generator"
version = "0.1.0"
description = "Newsbreak take-home: one-sentence input → hot event topic page."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.30",
    "tavily-python>=0.3",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.scripts]
generate = "generator.cli:app"

[tool.uv]
dev-dependencies = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
